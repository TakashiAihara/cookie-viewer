name: opencode-review

# Reviews each PR with opencode on a free Zen model. The workflow, its model and its
# permissions live in TakashiAihara/opencode-review. It is pinned to a commit because it receives
# a secret; Dependabot opens a PR when that repo moves on.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  opencode:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: TakashiAihara/opencode-review/.github/workflows/review.yml@02d4030e386580f58baec9885c0f3ef6403b15ae # main
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
