<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { font: 12px/1.4 system-ui, sans-serif; margin: 8px; width: 640px; }
  #bar { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #filter { flex: 1; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th, td { border-bottom: 1px solid #ddd; padding: 3px 4px; text-align: left; vertical-align: top; }
  td { overflow-wrap: anywhere; }
  .v { font-family: ui-monospace, monospace; word-break: break-all; }
  td button { white-space: nowrap; }
  .muted { color: #888; }
</style>
</head>
<body>
<div id="host" class="muted"></div>
<div id="bar">
  <input id="filter" placeholder="名前で絞り込み">
  <label><input type="checkbox" id="reveal"> 値を表示</label>
</div>
<button id="grant" hidden>このサイトの Cookie を読む許可を出す</button>
<div id="msg" class="muted"></div>
<table hidden id="tbl">
  <colgroup><col style="width:20%"><col style="width:32%"><col style="width:15%"><col style="width:24%"><col style="width:9%"></colgroup>
  <thead><tr><th>Name</th><th>Value</th><th>Domain / Path</th><th>属性 / 期限</th><th>Copy</th></tr></thead>
  <tbody></tbody>
</table>
<script src="popup.js"></script>
</body>
</html>
